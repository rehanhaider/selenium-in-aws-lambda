[project]
name = "selenium-in-aws-lambda"
version = "0"
requires-python = ">=3.13"

[dependency-groups]
cdk = ["aws-cdk-lib==2.278.0", "constructs==10.8.1"]
test = ["pytest==9.2.0", "selenium==4.54.0"]

[tool.uv]
package = false
default-groups = ["cdk", "test"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"
